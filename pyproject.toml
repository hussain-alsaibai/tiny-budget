[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-budget"
version = "0.2.0"
description = "LLM cost tracking for multi-model AI agents — stdlib only, JSON-persisted."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com" }]
keywords = ["llm", "ai-agents", "cost-tracking", "multi-model", "openclaw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-budget"
Issues = "https://github.com/hussain-alsaibai/tiny-budget/issues"

[tool.setuptools]
py-modules = ["tiny_budget"]